# Mic EQ "bright" (opt-in extra): high-pass 100 Hz, -3 dB @300 Hz, +5 dB @3.2 kHz, +7 dB high shelf from 6 kHz, -4 dB
# in front so the boost can't clip. The Steam Frame mic sounds dark/"dead" over Steam Link; this brings back clarity.
# Runs as its own PipeWire client: pipewire -c mic_eq.conf. Its output "lainframe_mic_eq" is linked to the PC stream (vrlink).
context.properties = { log.level = 0 }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert  support.* = support/libspa-support }
context.modules = [
  { name = libpipewire-module-rt  flags = [ ifexists nofail ] }
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Lainframe mic EQ"
      media.name = "Lainframe mic EQ"
      filter.graph = {
        nodes = [
          { type = builtin name = pre  label = bq_highshelf control = { "Freq" = 10.0  "Q" = 0.7 "Gain" = -4.0 } }
          { type = builtin name = hp   label = bq_highpass  control = { "Freq" = 100.0 "Q" = 0.707 } }
          { type = builtin name = mud  label = bq_peaking   control = { "Freq" = 300.0 "Q" = 1.0 "Gain" = -3.0 } }
          { type = builtin name = pres label = bq_peaking   control = { "Freq" = 3200.0 "Q" = 0.9 "Gain" = 5.0 } }
          { type = builtin name = air  label = bq_highshelf control = { "Freq" = 6000.0 "Q" = 0.7 "Gain" = 7.0 } }
        ]
        links = [
          { output = "pre:Out" input = "hp:In" }
          { output = "hp:Out"  input = "mud:In" }
          { output = "mud:Out" input = "pres:In" }
          { output = "pres:Out" input = "air:In" }
        ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name = "lainframe_mic_eq_in"
        node.passive = true
        target.object = "alsa_loopback_device.alsa_input.platform-sound.HiFi__Mic__source"
      }
      playback.props = {
        node.name = "lainframe_mic_eq"
        node.description = "Lainframe mic EQ"
        media.class = Audio/Source
      }
    }
  }
]
